name: Build, publish and deploy STAGING project to UmbHost
on:
  workflow_dispatch: 
env:
    SolutionName: ${{ secrets.SOLUTION_NAME }}
    BuildPlatform: Any CPU
    BuildConfiguration: Release
    NodeVersion: 18
    FrontendDir: H5YR/frontend
jobs:
  build:
    runs-on: windows-latest
    environment: DEV
    
    steps:
        - name: Get current date
          id: date
          uses: Kaven-Universe/github-action-current-date-time@v1.1.0
          with:
            format: "YYYY_MM_DD HH_mm_ss_SSS"
        - name: Use Node.js ${{env.NodeVersion}}
          uses: actions/setup-node@v3
          with:
            node-version: ${{env.NodeVersion}}
            
        - name: Checkout
          uses: actions/checkout@v3.0.0
          with:
            submodules: 'true'
        - uses: actions/cache@v3
          id: cache-nuget-h5yr
          with:
            path: |
              ~/.nuget/packages
            key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
            restore-keys: |
              ${{ runner.os }}-nuget-h5yr
        - name: Install NPM dependencies
          run: npm ci
          working-directory: ${{env.FrontendDir}}
  
        - name: Build frontend
          run: npm run build
          working-directory: ${{env.FrontendDir}}

        - name: Variable Substitution
          uses: microsoft/variable-substitution@v1
          with:
            files: 'H5YR/appsettings.json'
          env:
            ConnectionStrings.umbracoDbDSN: ${{ secrets.UMBHOST_DATABASE_CONNECTION_STRING }}
            ConnectionStrings.umbracoDbDSN_ProviderName: "Microsoft.Data.SqlClient"
            WidgetSettings.GitHubClientId: ${{secrets.WIDGET_GITHUB_CLIENT_ID}}
            WidgetSettings.GitHubClientSecret: ${{secrets.WIDGET_GITHUB_CLIENT_SECRET}}
            WidgetSettings.GoogleClientId: ${{secrets.WIDGET_GOOGLE_CLIENT_ID}}
            WidgetSettings.GoogleClientSecret: ${{secrets.WIDGET_GOOGLE_CLIENT_SECRET}}
            WidgetSettings.JwtSigningKey: ${{secrets.WIDGET_JWT_SIGNING_KEY}}

        - name: Publish Solution
          run: |
            dotnet publish ${{env.SolutionName}} --configuration ${{env.BuildConfiguration}} --output "_publish" /p:platform="${{env.BuildPlatform}}" /p:SkipInvalidConfigurations=true /p:AutoParameterizationWebConfigConnectionStrings=False

        - name: Zip publish output
          run: Compress-Archive -Path "_publish\*" -DestinationPath "_publish\H5YR.zip"
          shell: pwsh
            
        - name: Deploy to UmbHost EU
          uses: UmbHost/umbhost-web-deploy@v1.0.1
          with:
            website-name: ${{ secrets.UMBHOST_WEBSITE_NAME }}
            server-computer-name: ${{ secrets.UMBHOST_SERVER_COMPUTER_NAME }}
            server-username: ${{ secrets.UMBHOST_USERNAME }}
            server-password: ${{ secrets.UMBHOST_PASSWORD }}
            source-path: '_publish'
            source-fileName: H5YR.zip
            
        - name: Tag Build
          uses: tvdias/github-tagger@v0.0.1
          with:
            repo-token: ${{ secrets.GITHUB_TOKEN }}
            tag: StagingBuild-${{ steps.date.outputs.year }}${{ steps.date.outputs.month }}${{ steps.date.outputs.day }}-${{ github.run_number }}
